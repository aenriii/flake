[package]
name = "pyria"
version = "0.1.0"
edition = "2024"
lib = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
chacha20 = { version = "0.10.0", features = ["rng", "zeroize"] }
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12.0"
either = "1.15.0"
fido2-rs = "0.5.0"
hkdf = "0.13.0"
indicatif = "0.18.4"
libc = "0.2.186"
libcryptsetup-rs = { version = "0.15.1", features = ["mutex"] }
nix = { version = "0.31.2", features = ["user"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sharks = "0.5.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tss-esapi = "7.7.0"
zerocopy = "0.8.48"
zeroize = "1.8.2"

[[bin]]
name = "pyria-sudo"
path = "src/bin/sudo.rs"
dependencies.pyria = { path = "../" }